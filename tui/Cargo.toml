[package]
name = "naomi-tui"
version = "0.1.0"
edition = "2021"
description = "NAOMI interactive TUI foundation (P07)"
publish = false

[dependencies]
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Keep unwind so our panic hook always restores the terminal cleanly.
panic = "unwind"
